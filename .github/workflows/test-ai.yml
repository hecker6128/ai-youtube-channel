name: Generate History Short

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Pixabay Image API
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          import urllib.error

          key = os.environ.get("PIXABAY_API_KEY")

          if not key:
              raise RuntimeError(
                  "PIXABAY_API_KEY GitHub Secret is missing."
              )

          print("Testing Pixabay Image API...")

          params = urllib.parse.urlencode({
              "key": key,
              "q": "history",
              "per_page": 3,
              "safesearch": "true"
          })

          url = "https://pixabay.com/api/?" + params

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "Pixabay Image HTTP status:",
                      response.status
                  )

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

                  print(
                      "Image API total hits:",
                      data.get("totalHits")
                  )

                  print("Pixabay Image API test passed.")

          except urllib.error.HTTPError as exc:
              body = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  "Pixabay Image API FAILED"
              )
              print(
                  "HTTP status:",
                  exc.code
              )
              print(
                  "Response:",
                  body[:2000]
              )

              raise

          except Exception as exc:
              print(
                  "Pixabay Image API test FAILED:"
              )
              print(repr(exc))
              raise

          PY

      - name: Test Pixabay Video API
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          import urllib.error

          key = os.environ.get("PIXABAY_API_KEY")

          if not key:
              raise RuntimeError(
                  "PIXABAY_API_KEY GitHub Secret is missing."
              )

          print("Testing Pixabay Video API...")

          params = urllib.parse.urlencode({
              "key": key,
              "q": "history",
              "per_page": 3,
              "safesearch": "true"
          })

          url = "https://pixabay.com/api/videos/?" + params

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "Pixabay Video HTTP status:",
                      response.status
                  )

                  data = json.loads(
                      response.read().decode("utf-8")
                  )

                  print(
                      "Video API total hits:",
                      data.get("totalHits")
                  )

                  print("Pixabay Video API test passed.")

          except urllib.error.HTTPError as exc:
              body = exc.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  "Pixabay Video API FAILED"
              )
              print(
                  "HTTP status:",
                  exc.code
              )
              print(
                  "Response:",
                  body[:2000]
              )

              raise

          except Exception as exc:
              print(
                  "Pixabay Video API test FAILED:"
              )
              print(repr(exc))
              raise

          PY

      - name: Check main.py
        run: |
          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"
          python --version

          echo ""
          echo "========================================"
          echo "MAIN.PY LOCATION"
          echo "========================================"
          pwd
          ls -lh src/main.py

          echo ""
          echo "========================================"
          echo "PYTHON SYNTAX CHECK"
          echo "========================================"
          python -m py_compile src/main.py

          echo "Syntax check passed."

      - name: Generate script, visuals, voice and video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          echo "========================================"
          echo "STARTING AI VIDEO GENERATOR"
          echo "========================================"

          python -u src/main.py

          echo ""
          echo "========================================"
          echo "MAIN.PY FINISHED"
          echo "========================================"

      - name: Check generated files
        run: |
          echo "========================================"
          echo "OUTPUT DIRECTORY"
          echo "========================================"

          if [ -d "output" ]; then
            echo "output/ exists."
            ls -lah output/
          else
            echo "ERROR: output/ directory does not exist."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SCENES DIRECTORY"
          echo "========================================"

          if [ -d "output/scenes" ]; then
            ls -lah output/scenes/
          else
            echo "output/scenes/ does not exist."
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-assets
          path: output/
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false